<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Writing Topic: The Map and the Bicycle</title>
  <style>
    :root{--ink:#20333a;--paper:#fffaf0;--teal:#117b7d;--coral:#ef6b55;--green:#78a86d}
    *{box-sizing:border-box} body{margin:0;background:#edf4ef;color:var(--ink);font-family:Arial,sans-serif}
    main{width:min(1000px,94vw);margin:28px auto;background:var(--paper);border-radius:24px;box-shadow:0 16px 45px #36584b2b;overflow:hidden}
    header{padding:28px 36px 18px;text-align:center;background:linear-gradient(135deg,#d8f0e4,#fff3d6)}
    h1{margin:0;color:#155d62;font-family:Georgia,serif;font-size:clamp(30px,5vw,52px)}
    .instruction{margin:10px 0 0;font-size:18px}
    .scene{padding:24px 30px 8px}.picture{display:block;width:100%;height:auto;border:8px solid white;border-radius:18px;box-shadow:0 8px 22px #24483a25;background:#f5e8c8}
    .writing{padding:16px 36px 38px}.writing h2{font:700 27px Georgia,serif;color:#155d62;margin:0 0 8px}
    .hint{margin:0 0 20px;color:#566b70}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 24px;counter-reset:item}
    .line{display:flex;align-items:flex-end;gap:10px;min-height:42px}.line:before{counter-increment:item;content:counter(item) ".";font-weight:bold;color:var(--coral);min-width:25px}
    .rule{flex:1;border-bottom:2px solid #9bb7ad;height:34px}
    footer{text-align:center;padding:14px;background:#155d62;color:white;font-weight:bold;letter-spacing:.3px}
    @media(max-width:650px){.grid{grid-template-columns:1fr}.writing,header{padding-left:22px;padding-right:22px}}
    @media print{body{background:white}main{width:100%;margin:0;box-shadow:none}.picture{max-height:420px}.line{min-height:34px}}
  </style>
</head>
<body>
<main>
  <header>
    <h1>Writing topic:</h1>
    <p class="instruction">Give 10 sentences to describe the map and the bicycle.</p>
  </header>
  <section class="scene" aria-label="A bicycle on a map">
    <svg class="picture" viewBox="0 0 920 520" role="img" aria-label="A teal bicycle standing over a colorful map with roads, a river, trees, and a red route">
      <defs><pattern id="paper" width="70" height="70" patternUnits="userSpaceOnUse"><rect width="70" height="70" fill="#f5e8c8"/><path d="M0 18h70M22 0v70" stroke="#d8c89e" stroke-width="1" opacity=".4"/></pattern></defs>
      <rect width="920" height="520" fill="url(#paper)"/>
      <path d="M-30 120C160 45 260 210 430 135S720 55 960 150M-10 360C170 275 280 430 470 330S760 250 940 360" fill="none" stroke="#fff" stroke-width="26"/>
      <path d="M-30 120C160 45 260 210 430 135S720 55 960 150M-10 360C170 275 280 430 470 330S760 250 940 360" fill="none" stroke="#d9b982" stroke-width="4" stroke-dasharray="11 8"/>
      <path d="M375 -20C325 110 450 150 397 255S300 435 380 550" fill="none" stroke="#70bdd1" stroke-width="54" opacity=".9"/>
      <path d="M85 88C195 145 190 245 302 260S535 168 650 225 740 405 870 420" fill="none" stroke="#ef6b55" stroke-width="10" stroke-linecap="round" stroke-dasharray="18 10"/>
      <g fill="#78a86d"><circle cx="80" cy="200" r="25"/><circle cx="125" cy="230" r="19"/><circle cx="710" cy="90" r="27"/><circle cx="770" cy="105" r="21"/><circle cx="805" cy="250" r="25"/><circle cx="100" cy="420" r="23"/></g>
      <g fill="#fff8e7" stroke="#ba765d" stroke-width="4"><path d="M600 70h80v60h-80z"/><path d="M590 70l50-38 50 38z"/><path d="M160 300h70v55h-70z"/><path d="M150 300l45-34 45 34z"/></g>
      <g fill="none" stroke="#263f43" stroke-width="10">
        <circle cx="285" cy="365" r="105" fill="#fff8"/><circle cx="665" cy="365" r="105" fill="#fff8"/>
        <path d="M285 365l135-155 92 155H285l70-120 157 120 70-185M420 210h78M565 182h75M605 182l60 183"/>
      </g>
      <g fill="none" stroke="#117b7d" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"><path d="M285 365l135-155 92 155H285l70-120 157 120 70-185"/><path d="M604 182l60 183"/></g>
      <g stroke="#263f43" stroke-width="8" stroke-linecap="round"><path d="M400 199h100"/><path d="M565 176h78"/><path d="M422 210v-28"/><path d="M408 180h-55"/></g>
      <circle cx="420" cy="365" r="18" fill="#f4c857" stroke="#263f43" stroke-width="7"/><path d="M420 365l35 22M420 365l-30-22" stroke="#263f43" stroke-width="7"/>
      <g fill="#ef6b55" stroke="#fff" stroke-width="5"><circle cx="85" cy="88" r="12"/><circle cx="870" cy="420" r="12"/></g>
      <path d="M854 393l26 27-35 5" fill="none" stroke="#ef6b55" stroke-width="10" stroke-linecap="round"/>
    </svg>
  </section>
  <section class="writing">
    <h2>My 10 Sentences</h2>
    <p class="hint">Look closely. You can write about colors, places, shapes, position, and where the bicycle might go.</p>
    <div class="grid">
      <div class="line"><span class="rule"></span></div><div class="line"><span class="rule"></span></div>
      <div class="line"><span class="rule"></span></div><div class="line"><span class="rule"></span></div>
      <div class="line"><span class="rule"></span></div><div class="line"><span class="rule"></span></div>
      <div class="line"><span class="rule"></span></div><div class="line"><span class="rule"></span></div>
      <div class="line"><span class="rule"></span></div><div class="line"><span class="rule"></span></div>
    </div>
  </section>
  <footer>Observe • Imagine • Describe</footer>
</main>
</body>
</html>
